[package]
name = "chan-downloader"
description = "CLI to download all images/webms of a 4chan thread"
version = "0.4.0"
authors = ["Mariot Tsitoara <mariot.tsitoara@pm.me>"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/mariot/chan-downloader"
repository = "https://github.com/mariot/chan-downloader"
keywords = ["cli", "4chan", "4plebs", "download", "crawler"]
categories = ["command-line-utilities"]

[lib]
name = "chan_downloader"
path = "src/lib.rs"

[[bin]]
name = "chan-downloader"
path = "src/bin.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["cargo"] }
env_logger = "0.11.11"
futures = "0.3.34"
indicatif = "0.18.6"
log = "0.4.34"
regex = "1.13.1"
reqwest = "0.13.5"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
